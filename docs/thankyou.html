<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Message Sent — Kyle Whittle</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='16' fill='%23e85d26'/><text x='16' y='16' font-family='Georgia,serif' font-size='12' font-weight='400' fill='%23ffffff' text-anchor='middle' dominant-baseline='central' letter-spacing='1'>KW</text></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='16' fill='%23e85d26'/><text x='16' y='16' font-family='Georgia,serif' font-size='12' font-weight='400' fill='%23ffffff' text-anchor='middle' dominant-baseline='central' letter-spacing='1'>KW</text></svg>">
  <style>
    :root {
      --bg: #ffffff;
      --bg-alt: #f5f5f5;
      --text: #1a1a1a;
      --text-muted: #666666;
      --accent: #e85d26;
      --accent-hover: #cf4f1e;
      --border: #e0e0e0;
      --bg-dark:            #0d0d0d;
      --bg-warm:            #f5f0e8;
      --text-on-dark:       #e8e0d4;
      --text-muted-on-dark: #a09080;
      --border-dark:        rgba(255, 255, 255, 0.10);
      --accent-light:       #f07040;
    }

    html { scroll-behavior: smooth; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.7;
    }

    /* ── Navigation ── */
    .site-nav {
      position: sticky;
      top: 0;
      z-index: 900;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 24px;
      background: transparent;
      border-bottom: 1px solid transparent;
      transition: background 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease;
    }

    .site-nav.nav-scrolled {
      background: var(--bg-dark);
      border-bottom-color: var(--border-dark);
      box-shadow: 0 2px 20px rgba(0, 0, 0, 0.4);
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .nav-logo-circle {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--accent);
      color: #ffffff;
      font-family: Futura, "Century Gothic", "Trebuchet MS", Arial, sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nav-logo-name {
      font-family: Futura, "Century Gothic", "Trebuchet MS", Arial, sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: #ffffff;
      text-transform: uppercase;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .nav-links a {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-decoration: none;
      color: #ffffff;
      padding-bottom: 4px;
      border-bottom: 2px solid transparent;
      transition: color 0.15s, border-color 0.15s;
    }

    .nav-links a:hover {
      color: var(--accent-light);
    }

    /* ── Hero ── */
    .hero {
      background: var(--bg-dark);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: clamp(80px, 16vw, 180px) 24px;
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: "\2713";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: Futura, "Century Gothic", "Trebuchet MS", Arial, sans-serif;
      font-size: clamp(280px, 45vw, 560px);
      font-weight: 700;
      color: rgba(255, 255, 255, 0.025);
      line-height: 1;
      pointer-events: none;
      user-select: none;
    }

    .checkmark {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 32px;
      position: relative;
      z-index: 1;
    }

    .checkmark svg {
      width: 32px;
      height: 32px;
    }

    .hero-eyebrow {
      font-family: Futura, "Century Gothic", "Trebuchet MS", Arial, sans-serif;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--accent-light);
      margin-bottom: 16px;
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .hero-eyebrow::before,
    .hero-eyebrow::after {
      content: "";
      display: inline-block;
      width: 32px;
      height: 1px;
      background: var(--accent-light);
      flex-shrink: 0;
    }

    .tagline {
      font-family: Futura, "Century Gothic", "Trebuchet MS", Arial, sans-serif;
      font-size: clamp(2.4rem, 5vw, 4rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #ffffff;
      margin-bottom: 16px;
      line-height: 1.1;
      position: relative;
      z-index: 1;
    }

    .subtitle {
      font-size: clamp(1rem, 1.8vw, 1.1rem);
      color: var(--text-on-dark);
      max-width: 44ch;
      line-height: 1.65;
      position: relative;
      z-index: 1;
    }

    /* ── Content Section ── */
    main {
      max-width: 680px;
      margin: 0 auto;
      padding: 0 24px;
    }

    section {
      padding: 64px 0 80px;
      text-align: center;
    }

    p {
      color: var(--text-muted);
      max-width: 52ch;
      margin: 0 auto;
    }

    .cta-link {
      display: inline-block;
      margin-top: 32px;
      padding: 14px 36px;
      background: var(--accent);
      color: #ffffff;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-decoration: none;
      border-radius: 40px;
      transition: background 0.2s, transform 0.2s;
    }

    .cta-link:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    /* ── Fade-up scroll animation ── */
    .fade-up {
      opacity: 0;
      transform: translateY(28px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    .fade-up.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    @media (prefers-reduced-motion: reduce) {
      .fade-up { opacity: 1; transform: none; transition: none; }
    }

    /* ── Responsive ── */
    @media (max-width: 520px) {
      .tagline { font-size: 2rem; }
      .site-nav { flex-wrap: wrap; gap: 8px; padding: 10px 16px; }
      .nav-logo-name { display: none; }
      .nav-links { gap: 14px; }
      .nav-links a { font-size: 0.6rem; letter-spacing: 1.5px; }
    }
  </style>
</head>
<body>
  <nav class="site-nav">
    <a href="index.html" class="nav-logo">
      <span class="nav-logo-circle">KW</span>
      <span class="nav-logo-name">Kyle Whittle</span>
    </a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="services.html">What I Offer</a>
      <a href="about.html">About</a>
      <a href="course.html">Free Course</a>
      <a href="contact.html">Contact</a>
    </div>
  </nav>

  <header class="hero" id="hero">
    <div class="checkmark">
      <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <polyline points="6,17 13,24 26,9" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <p class="hero-eyebrow">You're all set</p>
    <p class="tagline">Message received.</p>
    <p class="subtitle">I'll be in touch soon. In the meantime, take a breath — you already did the hard part.</p>
  </header>

  <main>
    <section class="fade-up">
      <p>While you wait, feel free to explore the free Stoicism mini-course or read more about how I work.</p>
      <a href="index.html" class="cta-link">Back to Home</a>
    </section>
  </main>

  <script>
    (function () {
      var nav = document.querySelector('.site-nav');
      var hero = document.getElementById('hero');
      if (!nav || !hero) return;
      var obs = new IntersectionObserver(function (entries) {
        nav.classList.toggle('nav-scrolled', !entries[0].isIntersecting);
      }, { threshold: 0, rootMargin: '-60px 0px 0px 0px' });
      obs.observe(hero);
    }());
  </script>

  <script>
    (function () {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      var targets = document.querySelectorAll('.fade-up');
      if (!targets.length) return;
      var obs = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add('is-visible');
            obs.unobserve(entry.target);
          }
        });
      }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
      targets.forEach(function (el) { obs.observe(el); });
    }());
  </script>
</body>
</html>
