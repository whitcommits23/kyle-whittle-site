<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- EDIT: Page title shown in browser tab -->
  <title>Message Sent | Kyle Whittle</title>
  <!-- END EDIT -->
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#2B2F33">
  <!-- Favicon: carved block KW mark -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 44 44'><path d='M9 0H35L44 9V35L35 44H9L0 35V9Z' fill='%232B2F33'/><text x='22' y='29.5' text-anchor='middle' font-family='Palatino,Georgia,serif' font-size='20' fill='%23ECEAE4'>KW</text></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 44 44'><path d='M9 0H35L44 9V35L35 44H9L0 35V9Z' fill='%232B2F33'/><text x='22' y='29.5' text-anchor='middle' font-family='Palatino,Georgia,serif' font-size='20' fill='%23ECEAE4'>KW</text></svg>">
  <style>
    /* Palette: weathered stone. Bronze is reserved for things you can click. */
    :root {
      --granite:       #E4E2DC;
      --limestone:     #F3F2EE;
      --slate:         #2B2F33;
      --slate-soft:    #3A3F44;
      --bronze:        #8A6A3B;
      --bronze-hover:  #765A30;
      --bronze-deep:   #6F5430;
      --bronze-light:  #C9A56A;
      --moss:          #4E5B45;
      --text:          #2B2F33;
      --text-muted:    #5C6166;
      --text-on-slate: #ECEAE4;
      --muted-on-slate:#A9ADA8;
      --rule:          #C9C6BE;
      --rule-on-slate: rgba(236, 234, 228, 0.16);
      --radius:        4px;

      /* Carved corners, matching the logo block. Small for buttons, large for photos. */
      --carve-sm: polygon(7px 0, calc(100% - 7px) 0, 100% 7px, 100% calc(100% - 7px), calc(100% - 7px) 100%, 7px 100%, 0 calc(100% - 7px), 0 7px);
      --carve-lg: polygon(32px 0, calc(100% - 32px) 0, 100% 32px, 100% calc(100% - 32px), calc(100% - 32px) 100%, 32px 100%, 0 calc(100% - 32px), 0 32px);

      --serif: "Palatino Linotype", Palatino, "Book Antiqua", "URW Palladio L", P052, Georgia, serif;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; scroll-padding-top: 80px; }

    body {
      font-family: var(--sans);
      font-size: 1.0625rem;
      line-height: 1.65;
      color: var(--text);
      background: var(--granite);
      -webkit-font-smoothing: antialiased;
    }

    img { display: block; max-width: 100%; }

    a { color: var(--bronze-deep); text-underline-offset: 3px; text-decoration-thickness: 1px; }
    a:hover { color: var(--slate); }

    :focus-visible { outline: 2px solid var(--bronze); outline-offset: 3px; border-radius: 2px; }

    h1, h2, h3 { font-family: var(--serif); font-weight: 400; color: inherit; }

    h2 {
      font-size: clamp(1.75rem, 3.6vw, 2.375rem);
      line-height: 1.15;
      letter-spacing: -0.005em;
      margin-bottom: 1.25rem;
    }

    h3 { font-size: 1.375rem; line-height: 1.25; margin-bottom: 0.75rem; }

    p + p { margin-top: 1.1em; }

    /* ── Nav ─────────────────────────────────────── */
    .site-nav {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px 32px;
      padding: 18px clamp(16px, 5vw, 56px);
      background: var(--slate);
      border-bottom: 1px solid transparent;
      transition: border-color 0.2s ease;
    }

    .site-nav.nav-scrolled { border-bottom-color: var(--rule-on-slate); }

    .site-nav :focus-visible { outline-color: var(--bronze-light); }

    .nav-logo {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-family: var(--serif);
      font-size: 1.25rem;
      color: var(--text-on-slate);
      text-decoration: none;
      white-space: nowrap;
    }

    .nav-logo:hover { color: var(--text-on-slate); }

    .nav-mark { width: 32px; height: 32px; flex: none; }

    .nav-links { display: flex; flex-wrap: wrap; gap: 6px 26px; }

    .nav-links a {
      font-size: 0.9375rem;
      color: var(--muted-on-slate);
      text-decoration: none;
    }

    .nav-links a:hover { color: var(--bronze-light); }

    .nav-links a.active { color: var(--text-on-slate); text-decoration: underline; text-underline-offset: 6px; }

    /* ── Buttons ─────────────────────────────────── */
    .cta-btn {
      display: inline-block;
      padding: 14px 26px;
      font-family: var(--sans);
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      background: var(--bronze);
      border: 0;
      clip-path: var(--carve-sm);
      text-decoration: none;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .cta-btn:hover { background: var(--bronze-hover); color: #fff; }

    /* clip-path would hide an outside outline, so the focus ring sits inside the button. */
    .cta-btn:focus-visible { outline: none; box-shadow: inset 0 0 0 2px var(--slate), inset 0 0 0 4px #fff; }

    .band--slate .cta-btn { background: var(--bronze-light); color: var(--slate); }
    .band--slate .cta-btn:hover { background: #D8B87F; color: var(--slate); }

    /* ── Page hero ───────────────────────────────── */
    .hero {
      padding: clamp(48px, 9vh, 104px) clamp(16px, 5vw, 56px) clamp(56px, 9vh, 96px);
    }

    .hero-inner { max-width: 1120px; margin: 0 auto; }

    .hero-tagline {
      font-size: clamp(2.375rem, 5vw, 4rem);
      line-height: 1.07;
      letter-spacing: -0.015em;
      max-width: 16ch;
      color: var(--slate);
    }

    .hero-subtitle {
      margin-top: 24px;
      max-width: 34em;
      font-size: 1.1875rem;
      line-height: 1.6;
      color: var(--text-muted);
    }

    .hero-actions { margin-top: 34px; display: flex; flex-wrap: wrap; align-items: center; gap: 14px 28px; }

    /* ── Section bands ──────────────────────────── */
    .band { padding: clamp(64px, 10vw, 120px) 16px; }

    .band--granite   { background: var(--granite); }
    .band--limestone { background: var(--limestone); }
    .band--slate     { background: var(--slate); color: var(--text-on-slate); }

    .band--slate a { color: var(--bronze-light); }
    .band--slate a:hover { color: var(--text-on-slate); }

    .content-col { max-width: 680px; margin: 0 auto; }
    .content-col-wide { max-width: 900px; margin: 0 auto; }

    .lede { font-size: 1.1875rem; color: var(--text-muted); }
    .band--slate .lede { color: var(--muted-on-slate); }

    .contact-links { margin-top: 32px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px 28px; }

    /* ── Floating CTA: hidden while the page's own button is on screen ── */
    .cta-floating {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 40;
      opacity: 0;
      visibility: hidden;
      transform: translateY(8px);
      transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s;
    }

    .cta-floating.is-shown { opacity: 1; visibility: visible; transform: none; }

    /* The logo's carved block, with a check cut in place of the initials. */
    .done-mark { width: 64px; height: 64px; margin-bottom: 28px; color: var(--slate); }

    /* Short page: let the last band fill the rest of the screen. */
    body { display: flex; flex-direction: column; min-height: 100vh; }
    main { flex: 1; display: flex; flex-direction: column; }
    main > .band { flex: 1; }

    @media (max-width: 560px) {
      body { font-size: 1rem; }
      /* On phones the nav scrolls away; the floating button covers booking. */
      .site-nav { position: static; flex-direction: column; align-items: flex-start; gap: 6px; padding: 14px 16px; }
      .nav-links { gap: 4px 16px; }
      .nav-links a { font-size: 0.875rem; }
      .hero { padding-top: 36px; }
      .hero-subtitle { font-size: 1.0625rem; }
      .cta-floating { right: 16px; bottom: 16px; left: 16px; text-align: center; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body>
  <!-- EDIT: Navigation links -->
  <nav class="site-nav" aria-label="Main">
    <a href="index.html" class="nav-logo">
      <!-- Logo mark: a block with its corners carved off, KW cut out of it -->
      <svg class="nav-mark" viewBox="0 0 44 44" aria-hidden="true">
        <mask id="kw-cut">
          <path d="M9 0H35L44 9V35L35 44H9L0 35V9Z" fill="#fff"/>
          <text x="22" y="29.5" text-anchor="middle" font-family="Palatino Linotype, Palatino, Book Antiqua, Georgia, serif" font-size="20" fill="#000">KW</text>
        </mask>
        <rect width="44" height="44" fill="currentColor" mask="url(#kw-cut)"/>
      </svg>
      <span>Kyle Whittle</span>
    </a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="services.html">What I offer</a>
      <a href="about.html">About</a>
      <a href="course.html">Free course</a>
      <a href="contact.html">Contact</a>
    </div>
  </nav>
  <!-- END EDIT -->


  <header class="hero" id="hero">
    <div class="hero-inner">
      <svg class="done-mark" viewBox="0 0 44 44" aria-hidden="true">
        <mask id="check-cut">
          <path d="M9 0H35L44 9V35L35 44H9L0 35V9Z" fill="#fff"/>
          <polyline points="13,23 19.5,29.5 31,15" fill="none" stroke="#000" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
        </mask>
        <rect width="44" height="44" fill="currentColor" mask="url(#check-cut)"/>
      </svg>
      <!-- EDIT: Confirmation message -->
      <h1 class="hero-tagline">Message received.</h1>
      <p class="hero-subtitle">I'll be in touch soon. In the meantime, take a breath. You already did the hard part.</p>
      <!-- END EDIT -->
    </div>
  </header>

  <main>
    <section class="band band--limestone">
      <div class="content-col">
        <!-- EDIT: While you wait -->
        <p class="lede">While you wait, try the free Stoicism mini-course or read more about how I work.</p>
        <div class="contact-links">
          <a href="course.html" class="cta-btn">Start the free course</a>
          <a href="services.html">See how I work</a>
          <a href="index.html">Back to home</a>
        </div>
        <!-- END EDIT -->
      </div>
    </section>
  </main>

  <script>
    (function () {
      var nav = document.querySelector('.site-nav');
      function onScroll() { nav.classList.toggle('nav-scrolled', window.scrollY > 8); }
      window.addEventListener('scroll', onScroll, { passive: true });
      onScroll();

      var floating = document.getElementById('cta-floating');
      var start = document.querySelector('[data-cta-start]');
      var end = document.querySelector('[data-cta-end]');
      if (!floating || !start || !('IntersectionObserver' in window)) return;

      var startVisible = true;
      var endVisible = false;
      function update() { floating.classList.toggle('is-shown', !startVisible && !endVisible); }

      new IntersectionObserver(function (entries) {
        startVisible = entries[0].isIntersecting;
        update();
      }).observe(start);

      if (end) {
        new IntersectionObserver(function (entries) {
          endVisible = entries[0].isIntersecting;
          update();
        }).observe(end);
      }
    }());
  </script>
</body>
</html>
