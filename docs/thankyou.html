<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Message Sent — Kyle Whittle</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='16' fill='%23e85d26'/><text x='16' y='16' font-family='Georgia,serif' font-size='12' font-weight='400' fill='%23ffffff' text-anchor='middle' dominant-baseline='central' letter-spacing='1'>KW</text></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='16' fill='%23e85d26'/><text x='16' y='16' font-family='Georgia,serif' font-size='12' font-weight='400' fill='%23ffffff' text-anchor='middle' dominant-baseline='central' letter-spacing='1'>KW</text></svg>">
  <style>
    :root {
      --bg: #ffffff;
      --bg-alt: #f5f5f5;
      --text: #1a1a1a;
      --text-muted: #666666;
      --accent: #e85d26;
      --accent-hover: #cf4f1e;
      --border: #e0e0e0;
    }

    html { scroll-behavior: smooth; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.7;
    }

    main {
      max-width: 680px;
      margin: 0 auto;
      padding: 60px 24px 80px;
    }

    /* ── Navigation ── */
    .site-nav {
      position: sticky;
      top: 0;
      z-index: 900;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 24px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .nav-logo-circle {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--accent);
      color: #ffffff;
      font-family: Futura, "Century Gothic", "Trebuchet MS", Arial, sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nav-logo-name {
      font-family: Futura, "Century Gothic", "Trebuchet MS", Arial, sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--text);
      text-transform: uppercase;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .nav-links a {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--text);
      padding-bottom: 4px;
      border-bottom: 2px solid transparent;
      transition: color 0.15s, border-color 0.15s;
    }

    .nav-links a:hover {
      color: var(--accent);
    }

    /* ── Hero ── */
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding-bottom: 56px;
      border-bottom: 1px solid var(--border);
    }

    .hero::after {
      content: "\25C6";
      position: absolute;
      bottom: -0.35em;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.45rem;
      color: var(--accent);
      background: var(--bg);
      padding: 0 12px;
      line-height: 1;
    }

    .hero {
      position: relative;
    }

    .checkmark {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 28px;
    }

    .checkmark svg {
      width: 32px;
      height: 32px;
    }

    .tagline {
      font-family: Futura, "Century Gothic", "Trebuchet MS", Arial, sans-serif;
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--text);
      margin-bottom: 12px;
      line-height: 1.2;
    }

    .subtitle {
      font-size: 1rem;
      color: var(--text-muted);
      max-width: 44ch;
    }

    /* ── Section ── */
    section {
      padding: 48px 0;
      text-align: center;
    }

    p {
      color: var(--text-muted);
      max-width: 52ch;
      margin: 0 auto;
    }

    .cta-link {
      display: inline-block;
      margin-top: 32px;
      padding: 14px 36px;
      background: var(--text);
      color: #ffffff;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-decoration: none;
      border-radius: 40px;
      transition: background 0.2s, transform 0.2s;
    }

    .cta-link:hover {
      background: #333333;
      transform: translateY(-1px);
    }

    /* ── Responsive ── */
    @media (max-width: 520px) {
      .tagline { font-size: 1.8rem; }
      .site-nav { flex-wrap: wrap; gap: 8px; padding: 10px 16px; }
      .nav-logo-name { display: none; }
      .nav-links { gap: 14px; }
      .nav-links a { font-size: 0.6rem; letter-spacing: 1.5px; }
    }
  </style>
</head>
<body>
  <nav class="site-nav">
    <a href="index.html" class="nav-logo">
      <span class="nav-logo-circle">KW</span>
      <span class="nav-logo-name">Kyle Whittle</span>
    </a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="services.html">What I Offer</a>
      <a href="about.html">About</a>
      <a href="course.html">Free Course</a>
      <a href="contact.html">Contact</a>
    </div>
  </nav>

  <main>

    <header class="hero">
      <div class="checkmark">
        <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <polyline points="6,17 13,24 26,9" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <p class="tagline">Message received.</p>
      <p class="subtitle">I'll be in touch soon. In the meantime, take a breath — you already did the hard part.</p>
    </header>

    <section>
      <p>While you wait, feel free to explore the free Stoicism mini-course or read more about how I work.</p>
      <a href="index.html" class="cta-link">Back to Home</a>
    </section>

  </main>
</body>
</html>
