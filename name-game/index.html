<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Name Game</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f0f4ff;
      --card: #ffffff;
      --primary: #4f6ef7;
      --primary-dark: #3a57d4;
      --success: #22c55e;
      --danger: #ef4444;
      --text: #1e1e2e;
      --muted: #6b7280;
      --border: #e2e8f0;
      --radius: 16px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 60px;
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 4px;
    }

    h2 { font-size: 1.2rem; font-weight: 700; margin-bottom: 16px; }

    .subtitle {
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 32px;
    }

    /* ── Screens ── */
    .screen { width: 100%; max-width: 680px; display: none; }
    .screen.active { display: flex; flex-direction: column; align-items: center; }

    /* ── Cards ── */
    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 28px;
      width: 100%;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      margin-bottom: 16px;
    }

    /* ── Buttons ── */
    button {
      cursor: pointer;
      border: none;
      border-radius: 12px;
      font-family: inherit;
      font-weight: 600;
      font-size: 1rem;
      transition: transform 0.1s, opacity 0.1s;
    }
    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      padding: 14px 28px;
    }
    .btn-primary:hover:not(:disabled) { background: var(--primary-dark); }

    .btn-outline {
      background: transparent;
      border: 2px solid var(--border);
      color: var(--text);
      padding: 12px 24px;
    }
    .btn-outline:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }

    .btn-danger {
      background: #fee2e2;
      color: var(--danger);
      padding: 8px 14px;
      font-size: 0.85rem;
      border-radius: 8px;
    }
    .btn-danger:hover { background: #fecaca; }

    /* ─────────────────────────────────────────
       SETUP SCREEN
    ───────────────────────────────────────── */
    #setup-header {
      text-align: center;
      margin-bottom: 8px;
    }

    .add-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .add-form label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--muted);
      display: block;
      margin-bottom: 4px;
    }

    .add-form input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid var(--border);
      border-radius: 10px;
      font-family: inherit;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.15s;
    }
    .add-form input[type="text"]:focus { border-color: var(--primary); }

    .photo-upload-area {
      border: 2px dashed var(--border);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      position: relative;
    }
    .photo-upload-area:hover { border-color: var(--primary); background: #f5f7ff; }
    .photo-upload-area input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }

    .upload-preview {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      display: none;
      margin: 0 auto 8px;
      border: 3px solid var(--primary);
    }

    .upload-icon { font-size: 2rem; margin-bottom: 6px; }
    .upload-hint { font-size: 0.85rem; color: var(--muted); }

    .add-btn-row {
      display: flex;
      justify-content: flex-end;
    }

    /* Participant grid */
    .participants-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 12px;
      width: 100%;
    }

    .participant-card {
      background: var(--card);
      border-radius: 14px;
      padding: 14px 10px 10px;
      text-align: center;
      box-shadow: 0 1px 6px rgba(0,0,0,0.06);
      position: relative;
    }

    .participant-card img {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--border);
      margin-bottom: 8px;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }

    .participant-card .p-initials {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: var(--primary);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      font-weight: 700;
      margin: 0 auto 8px;
    }

    .participant-card .p-name {
      font-size: 0.8rem;
      font-weight: 600;
      word-break: break-word;
    }

    .participant-card .remove-btn {
      position: absolute;
      top: 6px;
      right: 6px;
      background: #fee2e2;
      color: var(--danger);
      border: none;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      font-size: 0.7rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-family: inherit;
    }
    .participant-card .remove-btn:hover { background: #fecaca; }

    .count-label {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .start-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
    }

    /* ─────────────────────────────────────────
       GAME SCREEN
    ───────────────────────────────────────── */
    .progress-bar-wrap {
      width: 100%;
      height: 6px;
      background: var(--border);
      border-radius: 99px;
      margin-bottom: 28px;
    }
    .progress-bar-fill {
      height: 100%;
      background: var(--primary);
      border-radius: 99px;
      transition: width 0.3s;
    }

    .game-round-info {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 6px;
      align-self: flex-start;
    }

    .score-badge {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 20px;
      align-self: flex-end;
    }

    .game-top-row {
      display: flex;
      justify-content: space-between;
      width: 100%;
      align-items: center;
    }

    .face-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 32px 24px;
      text-align: center;
      width: 100%;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      margin-bottom: 20px;
    }

    .face-card img {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      object-fit: cover;
      border: 5px solid var(--border);
      margin-bottom: 0;
    }

    .face-card .face-initials {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), #8b5cf6);
      color: #fff;
      font-size: 3.5rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
    }

    .question-label {
      font-size: 1.05rem;
      font-weight: 600;
      margin-top: 20px;
      color: var(--text);
    }

    /* Choice buttons */
    .choices-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
      margin-bottom: 12px;
    }

    .choice-btn {
      background: var(--card);
      border: 2px solid var(--border);
      color: var(--text);
      border-radius: 14px;
      padding: 16px 12px;
      font-size: 1rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s, transform 0.1s;
      text-align: center;
      word-break: break-word;
    }
    .choice-btn:hover:not(:disabled) {
      border-color: var(--primary);
      background: #f5f7ff;
    }
    .choice-btn:active:not(:disabled) { transform: scale(0.97); }

    .choice-btn.correct {
      background: #dcfce7;
      border-color: var(--success);
      color: #166534;
    }
    .choice-btn.wrong {
      background: #fee2e2;
      border-color: var(--danger);
      color: #991b1b;
    }

    .feedback-msg {
      font-size: 1.1rem;
      font-weight: 700;
      text-align: center;
      min-height: 28px;
      margin-bottom: 12px;
    }
    .feedback-msg.correct { color: var(--success); }
    .feedback-msg.wrong { color: var(--danger); }

    /* ─────────────────────────────────────────
       RESULTS SCREEN
    ───────────────────────────────────────── */
    .results-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .big-score {
      font-size: 4rem;
      font-weight: 900;
      color: var(--primary);
      line-height: 1;
    }

    .big-score-label {
      font-size: 1rem;
      color: var(--muted);
      margin-top: 4px;
    }

    .result-emoji {
      font-size: 3rem;
      margin-bottom: 8px;
    }

    .results-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .result-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-radius: 10px;
      background: var(--card);
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    }

    .result-row img, .result-row .res-initials {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
    }

    .result-row .res-initials {
      background: var(--primary);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      font-weight: 700;
    }

    .result-row .res-name {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .result-row .res-guess {
      font-size: 0.82rem;
      color: var(--muted);
    }

    .result-row .res-icon {
      margin-left: auto;
      font-size: 1.3rem;
    }

    .results-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 8px;
    }

    /* ── Responsive ── */
    @media (max-width: 480px) {
      .choices-grid { grid-template-columns: 1fr; }
      .face-card img, .face-card .face-initials { width: 140px; height: 140px; }
      .face-card .face-initials { font-size: 2.8rem; }
    }
  </style>
</head>
<body>

<!-- ═══════════════════════════════════════════
     SETUP SCREEN
═══════════════════════════════════════════ -->
<div id="screen-setup" class="screen active">
  <div id="setup-header">
    <h1>Name Game</h1>
    <p class="subtitle">Add everyone, then start guessing!</p>
  </div>

  <!-- Add person form -->
  <div class="card">
    <h2>Add a Person</h2>
    <div class="add-form">
      <div>
        <label for="input-name">Name</label>
        <input type="text" id="input-name" placeholder="e.g. Jordan Smith" autocomplete="off">
      </div>
      <div>
        <label>Photo <span style="font-weight:400;color:var(--muted)">(optional)</span></label>
        <div class="photo-upload-area" id="upload-area">
          <input type="file" id="input-photo" accept="image/*">
          <img id="upload-preview" class="upload-preview" alt="preview">
          <div id="upload-placeholder">
            <div class="upload-icon">📷</div>
            <div class="upload-hint">Click or drag a photo here</div>
          </div>
        </div>
      </div>
      <div class="add-btn-row">
        <button class="btn-primary" id="btn-add">Add Person</button>
      </div>
    </div>
  </div>

  <!-- Participant list -->
  <div id="participants-section" style="width:100%;display:none;">
    <p class="count-label" id="count-label"></p>
    <div class="participants-grid" id="participants-grid"></div>
    <br>
    <div class="start-row">
      <button class="btn-outline" id="btn-clear-all">Clear All</button>
      <button class="btn-primary" id="btn-start" disabled>Start Game</button>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════════
     GAME SCREEN
═══════════════════════════════════════════ -->
<div id="screen-game" class="screen">
  <div class="progress-bar-wrap" style="width:100%;max-width:680px;">
    <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>
  </div>

  <div class="game-top-row" style="width:100%;max-width:680px;">
    <span class="game-round-info" id="round-info">Question 1 of 10</span>
    <span class="score-badge" id="score-display">Score: 0</span>
  </div>

  <div class="face-card" id="face-card">
    <!-- photo or initials injected here -->
  </div>

  <p class="question-label">Who is this?</p>
  <br>

  <div class="choices-grid" id="choices-grid">
    <!-- choice buttons injected -->
  </div>

  <div class="feedback-msg" id="feedback-msg"></div>
</div>

<!-- ═══════════════════════════════════════════
     RESULTS SCREEN
═══════════════════════════════════════════ -->
<div id="screen-results" class="screen">
  <div class="results-header">
    <div class="result-emoji" id="result-emoji"></div>
    <div class="big-score" id="final-score"></div>
    <div class="big-score-label" id="final-score-label"></div>
    <p id="result-tagline" style="color:var(--muted);margin-top:8px;font-size:0.95rem;"></p>
  </div>

  <div class="card" style="padding:20px;">
    <h2 style="margin-bottom:12px;">Round Summary</h2>
    <div class="results-list" id="results-list"></div>
  </div>

  <div class="results-actions">
    <button class="btn-outline" id="btn-edit-roster">Edit Roster</button>
    <button class="btn-primary" id="btn-play-again">Play Again</button>
  </div>
</div>

<script>
  // ── State ──────────────────────────────────────────────────────────────────
  let participants = [];  // { id, name, photo: dataURL|null }
  let rounds = [];        // shuffled list of participant indices for this game
  let currentRound = 0;
  let score = 0;
  let roundResults = [];  // { participant, guessedName, correct }
  let awaitingNext = false;

  const ROUNDS_PER_GAME = 10;
  const CHOICES_COUNT = 4;

  // ── Persistence ────────────────────────────────────────────────────────────
  function save() {
    try { localStorage.setItem('namegame_participants', JSON.stringify(participants)); } catch(e) {}
  }
  function load() {
    try {
      const d = localStorage.getItem('namegame_participants');
      if (d) participants = JSON.parse(d);
    } catch(e) {}
  }

  // ── Screen management ──────────────────────────────────────────────────────
  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  // ── Utility ────────────────────────────────────────────────────────────────
  function initials(name) {
    return name.trim().split(/\s+/).slice(0,2).map(w => w[0].toUpperCase()).join('');
  }

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function avatarHTML(p, size = 70) {
    if (p.photo) {
      return `<img src="${p.photo}" alt="${p.name}" style="width:${size}px;height:${size}px;border-radius:50%;object-fit:cover;">`;
    }
    return `<div style="width:${size}px;height:${size}px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:${Math.round(size*0.35)}px;font-weight:700;">${initials(p.name)}</div>`;
  }

  // ── Setup screen ───────────────────────────────────────────────────────────
  let pendingPhoto = null;

  document.getElementById('input-photo').addEventListener('change', function() {
    const file = this.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      pendingPhoto = e.target.result;
      const preview = document.getElementById('upload-preview');
      preview.src = pendingPhoto;
      preview.style.display = 'block';
      document.getElementById('upload-placeholder').style.display = 'none';
    };
    reader.readAsDataURL(file);
  });

  document.getElementById('btn-add').addEventListener('click', addPerson);
  document.getElementById('input-name').addEventListener('keydown', e => {
    if (e.key === 'Enter') addPerson();
  });

  function addPerson() {
    const nameEl = document.getElementById('input-name');
    const name = nameEl.value.trim();
    if (!name) { nameEl.focus(); return; }

    participants.push({ id: Date.now(), name, photo: pendingPhoto });
    save();

    // Reset form
    nameEl.value = '';
    pendingPhoto = null;
    document.getElementById('input-photo').value = '';
    document.getElementById('upload-preview').style.display = 'none';
    document.getElementById('upload-placeholder').style.display = 'block';
    nameEl.focus();

    renderRoster();
  }

  function renderRoster() {
    const section = document.getElementById('participants-section');
    const grid = document.getElementById('participants-grid');
    const label = document.getElementById('count-label');
    const startBtn = document.getElementById('btn-start');

    if (participants.length === 0) {
      section.style.display = 'none';
      return;
    }

    section.style.display = 'block';
    label.textContent = `${participants.length} person${participants.length !== 1 ? 's' : ''} added`;
    startBtn.disabled = participants.length < 2;
    if (participants.length < 2) startBtn.title = 'Add at least 2 people to play';
    else startBtn.title = '';

    grid.innerHTML = participants.map(p => `
      <div class="participant-card">
        ${p.photo
          ? `<img src="${p.photo}" alt="${p.name}">`
          : `<div class="p-initials">${initials(p.name)}</div>`}
        <div class="p-name">${p.name}</div>
        <button class="remove-btn" onclick="removePerson(${p.id})" title="Remove">&times;</button>
      </div>
    `).join('');
  }

  function removePerson(id) {
    participants = participants.filter(p => p.id !== id);
    save();
    renderRoster();
  }

  document.getElementById('btn-clear-all').addEventListener('click', () => {
    if (!confirm('Remove all people from the roster?')) return;
    participants = [];
    save();
    renderRoster();
  });

  document.getElementById('btn-start').addEventListener('click', startGame);

  // ── Game logic ─────────────────────────────────────────────────────────────
  function startGame() {
    score = 0;
    currentRound = 0;
    roundResults = [];
    awaitingNext = false;

    // Build round list: cycle through all participants, shuffle
    const total = Math.min(ROUNDS_PER_GAME, participants.length);
    const pool = shuffle([...Array(participants.length).keys()]).slice(0, total);
    rounds = pool;

    showScreen('screen-game');
    renderRound();
  }

  function renderRound() {
    const total = rounds.length;
    const idx = rounds[currentRound];
    const subject = participants[idx];

    // Progress
    document.getElementById('progress-fill').style.width = `${(currentRound / total) * 100}%`;
    document.getElementById('round-info').textContent = `Question ${currentRound + 1} of ${total}`;
    document.getElementById('score-display').textContent = `Score: ${score}`;
    document.getElementById('feedback-msg').textContent = '';
    document.getElementById('feedback-msg').className = 'feedback-msg';

    // Face
    const faceCard = document.getElementById('face-card');
    if (subject.photo) {
      faceCard.innerHTML = `
        <img src="${subject.photo}" alt="Who is this?">
        <p class="question-label" style="margin-top:16px;">Who is this?</p>
      `;
    } else {
      faceCard.innerHTML = `
        <div class="face-initials">${initials(subject.name)}</div>
        <p class="question-label" style="margin-top:16px;">Who is this?</p>
      `;
    }

    // Choices: correct + random wrong ones
    const wrongPool = participants.filter((_, i) => i !== idx);
    const wrongs = shuffle(wrongPool).slice(0, CHOICES_COUNT - 1);
    const choices = shuffle([subject, ...wrongs]);

    const grid = document.getElementById('choices-grid');
    grid.innerHTML = choices.map(p => `
      <button class="choice-btn" data-id="${p.id}" onclick="handleChoice(this, ${p.id === subject.id}, '${p.name.replace(/'/g, "\\'")}', ${subject.id})">
        ${p.name}
      </button>
    `).join('');
  }

  function handleChoice(btn, isCorrect, guessedName, correctId) {
    if (awaitingNext) return;
    awaitingNext = true;

    const subjectIdx = rounds[currentRound];
    const subject = participants[subjectIdx];

    // Disable all choices
    document.querySelectorAll('.choice-btn').forEach(b => b.disabled = true);

    // Highlight
    if (isCorrect) {
      btn.classList.add('correct');
      score++;
    } else {
      btn.classList.add('wrong');
      // Show correct answer
      document.querySelectorAll('.choice-btn').forEach(b => {
        if (parseInt(b.dataset.id) === correctId) b.classList.add('correct');
      });
    }

    // Feedback
    const msg = document.getElementById('feedback-msg');
    if (isCorrect) {
      msg.textContent = ['Nice! ✓', 'Correct! ✓', 'Yes! ✓', 'Great! ✓'][Math.floor(Math.random()*4)];
      msg.className = 'feedback-msg correct';
    } else {
      msg.textContent = `That's ${subject.name}`;
      msg.className = 'feedback-msg wrong';
    }

    roundResults.push({ participant: subject, guessedName, correct: isCorrect });

    // Advance after short delay
    setTimeout(() => {
      awaitingNext = false;
      currentRound++;
      if (currentRound >= rounds.length) {
        showResults();
      } else {
        renderRound();
      }
    }, 1200);
  }

  // ── Results ────────────────────────────────────────────────────────────────
  function showResults() {
    const total = rounds.length;
    const pct = score / total;

    document.getElementById('final-score').textContent = `${score} / ${total}`;
    document.getElementById('final-score-label').textContent = `${Math.round(pct * 100)}% correct`;

    let emoji, tagline;
    if (pct === 1)        { emoji = '🏆'; tagline = 'Perfect score! You know everyone!'; }
    else if (pct >= 0.8)  { emoji = '🌟'; tagline = 'Amazing — almost there!'; }
    else if (pct >= 0.6)  { emoji = '👍'; tagline = 'Good job! Keep learning names.'; }
    else if (pct >= 0.4)  { emoji = '💪'; tagline = 'Not bad! Play again to improve.'; }
    else                  { emoji = '😅'; tagline = 'Keep practicing — you\'ll get them!'; }

    document.getElementById('result-emoji').textContent = emoji;
    document.getElementById('result-tagline').textContent = tagline;

    const list = document.getElementById('results-list');
    list.innerHTML = roundResults.map(r => `
      <div class="result-row">
        ${r.participant.photo
          ? `<img src="${r.participant.photo}" alt="${r.participant.name}">`
          : `<div class="res-initials">${initials(r.participant.name)}</div>`}
        <div>
          <div class="res-name">${r.participant.name}</div>
          ${!r.correct ? `<div class="res-guess">You guessed: ${r.guessedName}</div>` : ''}
        </div>
        <div class="res-icon">${r.correct ? '✅' : '❌'}</div>
      </div>
    `).join('');

    document.getElementById('progress-fill').style.width = '100%';
    showScreen('screen-results');
  }

  document.getElementById('btn-play-again').addEventListener('click', startGame);
  document.getElementById('btn-edit-roster').addEventListener('click', () => {
    renderRoster();
    showScreen('screen-setup');
  });

  // ── Init ───────────────────────────────────────────────────────────────────
  load();
  renderRoster();
</script>
</body>
</html>
