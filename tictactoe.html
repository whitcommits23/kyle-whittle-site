<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0f0f1a;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #e0e0e0;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      margin-bottom: 1.5rem;
      background: linear-gradient(135deg, #7c6fff, #ff6fa8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .scoreboard {
      display: flex;
      gap: 2rem;
      margin-bottom: 1.5rem;
    }

    .score-item {
      text-align: center;
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 12px;
      padding: 0.6rem 1.4rem;
      min-width: 80px;
    }

    .score-item .label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #888;
    }

    .score-item.x .label { color: #7c6fff; }
    .score-item.o .label { color: #ff6fa8; }

    .score-item .value {
      font-size: 1.8rem;
      font-weight: 700;
      line-height: 1.2;
    }

    .score-item.x .value { color: #7c6fff; }
    .score-item.o .value { color: #ff6fa8; }
    .score-item.tie .value { color: #888; }

    .status {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 1.2rem;
      height: 1.5rem;
      transition: opacity 0.2s;
    }

    .status .x-text { color: #7c6fff; }
    .status .o-text { color: #ff6fa8; }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 110px);
      grid-template-rows: repeat(3, 110px);
      gap: 8px;
      margin-bottom: 1.5rem;
      position: relative;
    }

    .cell {
      background: #1a1a2e;
      border: 2px solid #2a2a4a;
      border-radius: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      font-weight: 700;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
      user-select: none;
    }

    .cell:hover:not(.taken) {
      background: #23234a;
      border-color: #4a4a7a;
      transform: scale(1.04);
    }

    .cell.taken { cursor: default; }

    .cell.x { color: #7c6fff; }
    .cell.o { color: #ff6fa8; }

    .cell.winning {
      background: #22143a;
      border-color: #7c6fff;
      animation: pulse 0.6s ease-in-out infinite alternate;
    }

    .cell.winning.o {
      background: #3a1428;
      border-color: #ff6fa8;
    }

    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.06); }
    }

    .cell.pop {
      animation: pop 0.2s ease-out;
    }

    @keyframes pop {
      0%   { transform: scale(0.7); opacity: 0.5; }
      70%  { transform: scale(1.1); }
      100% { transform: scale(1); opacity: 1; }
    }

    .controls {
      display: flex;
      gap: 0.8rem;
    }

    button {
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      color: #e0e0e0;
      border-radius: 10px;
      padding: 0.55rem 1.3rem;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    button:hover {
      background: #23234a;
      border-color: #5a5a9a;
    }

    button.primary {
      background: linear-gradient(135deg, #7c6fff, #ff6fa8);
      border: none;
      color: #fff;
      font-weight: 600;
    }

    button.primary:hover {
      filter: brightness(1.15);
    }

    .mode-toggle {
      margin-bottom: 1.2rem;
      display: flex;
      gap: 0.5rem;
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 10px;
      padding: 4px;
    }

    .mode-btn {
      border: none;
      border-radius: 7px;
      padding: 0.4rem 1rem;
      font-size: 0.82rem;
      background: transparent;
      color: #888;
    }

    .mode-btn.active {
      background: #2a2a4a;
      color: #e0e0e0;
    }
  </style>
</head>
<body>
  <h1>Tic Tac Toe</h1>

  <div class="scoreboard">
    <div class="score-item x">
      <div class="label" id="x-label">X</div>
      <div class="value" id="score-x">0</div>
    </div>
    <div class="score-item tie">
      <div class="label">Ties</div>
      <div class="value" id="score-tie">0</div>
    </div>
    <div class="score-item o">
      <div class="label" id="o-label">O</div>
      <div class="value" id="score-o">0</div>
    </div>
  </div>

  <div class="mode-toggle">
    <button class="mode-btn active" id="btn-pvp" onclick="setMode('pvp')">2 Players</button>
    <button class="mode-btn" id="btn-ai" onclick="setMode('ai')">vs AI</button>
  </div>

  <div class="status" id="status"><span class="x-text">X</span>'s turn</div>

  <div class="board" id="board">
    <div class="cell" onclick="handleClick(0)"></div>
    <div class="cell" onclick="handleClick(1)"></div>
    <div class="cell" onclick="handleClick(2)"></div>
    <div class="cell" onclick="handleClick(3)"></div>
    <div class="cell" onclick="handleClick(4)"></div>
    <div class="cell" onclick="handleClick(5)"></div>
    <div class="cell" onclick="handleClick(6)"></div>
    <div class="cell" onclick="handleClick(7)"></div>
    <div class="cell" onclick="handleClick(8)"></div>
  </div>

  <div class="controls">
    <button class="primary" onclick="resetGame()">New Game</button>
    <button onclick="resetScores()">Reset Scores</button>
  </div>

  <script>
    const WINS = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

    let board = Array(9).fill(null);
    let current = 'X';
    let gameOver = false;
    let scores = { X: 0, O: 0, tie: 0 };
    let mode = 'pvp'; // 'pvp' or 'ai'
    let aiThinking = false;

    function setMode(m) {
      mode = m;
      document.getElementById('btn-pvp').className = 'mode-btn' + (m === 'pvp' ? ' active' : '');
      document.getElementById('btn-ai').className = 'mode-btn' + (m === 'ai' ? ' active' : '');
      document.getElementById('o-label').textContent = m === 'ai' ? 'AI' : 'O';
      resetGame();
    }

    function handleClick(i) {
      if (gameOver || board[i] || aiThinking) return;
      if (mode === 'ai' && current === 'O') return;
      makeMove(i);
      if (mode === 'ai' && !gameOver) {
        aiThinking = true;
        setTimeout(aiMove, 350);
      }
    }

    function makeMove(i) {
      board[i] = current;
      const cell = getCells()[i];
      cell.textContent = current;
      cell.classList.add(current.toLowerCase(), 'taken', 'pop');

      const win = checkWin();
      if (win) {
        endGame('win', win);
      } else if (board.every(Boolean)) {
        endGame('tie');
      } else {
        current = current === 'X' ? 'O' : 'X';
        updateStatus();
      }
    }

    function aiMove() {
      aiThinking = false;
      if (gameOver) return;
      const i = bestMove();
      makeMove(i);
    }

    function bestMove() {
      // Try to win
      for (let i = 0; i < 9; i++) {
        if (!board[i]) {
          board[i] = 'O';
          if (checkWin()) { board[i] = null; return i; }
          board[i] = null;
        }
      }
      // Block player from winning
      for (let i = 0; i < 9; i++) {
        if (!board[i]) {
          board[i] = 'X';
          if (checkWin()) { board[i] = null; return i; }
          board[i] = null;
        }
      }
      // Prefer center, then corners, then edges
      const preferred = [4, 0, 2, 6, 8, 1, 3, 5, 7];
      return preferred.find(i => !board[i]);
    }

    function checkWin() {
      return WINS.find(([a, b, c]) => board[a] && board[a] === board[b] && board[a] === board[c]) || null;
    }

    function endGame(result, winLine) {
      gameOver = true;
      const status = document.getElementById('status');
      if (result === 'win') {
        winLine.forEach(i => getCells()[i].classList.add('winning'));
        scores[current]++;
        updateScores();
        const label = mode === 'ai' && current === 'O' ? 'AI' : current;
        const cls = current.toLowerCase() + '-text';
        status.innerHTML = `<span class="${cls}">${label}</span> wins!`;
      } else {
        scores.tie++;
        updateScores();
        status.textContent = "It's a tie!";
      }
    }

    function updateStatus() {
      const status = document.getElementById('status');
      const label = mode === 'ai' && current === 'O' ? 'AI' : current;
      const cls = current.toLowerCase() + '-text';
      status.innerHTML = `<span class="${cls}">${label}</span>'s turn`;
    }

    function updateScores() {
      document.getElementById('score-x').textContent = scores.X;
      document.getElementById('score-o').textContent = scores.O;
      document.getElementById('score-tie').textContent = scores.tie;
    }

    function resetGame() {
      board = Array(9).fill(null);
      current = 'X';
      gameOver = false;
      aiThinking = false;
      getCells().forEach(c => {
        c.className = 'cell';
        c.textContent = '';
      });
      updateStatus();
    }

    function resetScores() {
      scores = { X: 0, O: 0, tie: 0 };
      updateScores();
      resetGame();
    }

    function getCells() {
      return [...document.querySelectorAll('.cell')];
    }
  </script>
</body>
</html>
